services:
  - type: web
    name: lingshu
    runtime: python
    region: oregon  # 美国西部，国内访问相对较快
    buildCommand: pip install -e .
    startCommand: python start_prod.py
    envVars:
      - key: HARNESS_API_HOST
        value: 0.0.0.0
      - key: HARNESS_DISABLE_AUTH
        value: "1"
      - key: HARNESS_DISABLE_RATE_LIMIT
        value: "1"
      # 不预设 LLM 地址: 运行时由前端 /v1/setup/config 或环境变量配置。
      # 招聘方/用户可自配 api_url/api_key(用自己的额度), 不烧部署者成本。
      # 未配置时降级为模板示例(Demo Mode)。
    healthCheckPath: /health
