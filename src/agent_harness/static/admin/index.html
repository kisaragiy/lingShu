<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>灵枢 · 系统状态</title>
<style>
:root {
  --bg: #f8f6f3; --card: #ffffff;
  --text: #1a1a2e; --text-secondary: #6b7280;
  --border: #e5ddd3; --accent: #7c3aed;
  --up: #059669; --degraded: #d97706; --down: #dc2626;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, 'SF Pro', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  padding: 48px 24px; max-width: 800px; margin: 0 auto;
}
h1 { font-weight: 800; font-size: 1.75rem; letter-spacing: -0.02em; margin-bottom: 4px; }
.subtitle { color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 32px; }
.status-bar {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-radius: 9999px;
  font-weight: 600; font-size: 0.875rem;
  margin-bottom: 32px;
}
.status-bar.healthy { background: #ecfdf5; color: var(--up); }
.status-bar.degraded { background: #fffbeb; color: var(--degraded); }
.status-bar.down { background: #fef2f2; color: var(--down); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.grid { display: flex; flex-direction: column; gap: 8px; }
.check {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; background: var(--card);
  border: 1px solid var(--border); border-radius: 8px;
  transition: transform 0.15s ease;
}
.check:hover { transform: translateX(2px); }
.check-left { display: flex; align-items: center; gap: 12px; }
.check-name { font-weight: 600; font-size: 0.9375rem; }
.check-detail { font-size: 0.8125rem; color: var(--text-secondary); }
.badge {
  padding: 2px 8px; border-radius: 9999px;
  font-size: 0.75rem; font-weight: 500;
}
.badge.up { background: #ecfdf5; color: var(--up); }
.badge.degraded { background: #fffbeb; color: var(--degraded); }
.badge.down { background: #fef2f2; color: var(--down); }
.footer { margin-top: 32px; font-size: 0.75rem; color: var(--text-secondary); }
.last-update { margin-top: 8px; font-size: 0.75rem; color: var(--text-secondary); }
.version-badge {
  display: inline-block; padding: 2px 10px;
  background: var(--accent); color: white;
  border-radius: 9999px; font-size: 0.75rem;
}
</style>
</head>
<body>

<h1>🩺 灵枢 · 状态</h1>
<p class="subtitle">系统运行状态监控 <span class="version-badge" id="version-tag">v0.73.0</span></p>

<div id="status-bar" class="status-bar healthy">
  <span class="dot"></span>
  <span id="status-text">加载中...</span>
</div>

<div class="grid" id="checks"></div>

<p class="last-update" id="last-update"></p>
<p class="footer">数据每 10 秒自动刷新 · <a href="/health" style="color:var(--accent)">/health (JSON)</a></p>

<script>
async function refresh() {
  try {
    const resp = await fetch('/health');
    const data = await resp.json();

    // 状态栏
    const bar = document.getElementById('status-bar');
    bar.className = 'status-bar ' + data.status;
    document.getElementById('status-text').textContent =
      data.status === 'healthy' ? '运行正常' :
      data.status === 'degraded' ? '部分降级' : '服务异常';

    // 版本
    if (data.version) {
      document.getElementById('version-tag').textContent = 'v' + data.version;
    }

    // 检查列表
    const html = data.checks.map(c => {
      const statusMap = { up: '正常', degraded: '降级', down: '不可用' };
      return `<div class="check">
        <div class="check-left">
          <span class="badge ${c.status}">${statusMap[c.status] || c.status}</span>
          <div>
            <div class="check-name">${c.name}</div>
            <div class="check-detail">${c.detail || ''}${c.latency_ms ? ' · ' + c.latency_ms + 'ms' : ''}</div>
          </div>
        </div>
      </div>`;
    }).join('');
    document.getElementById('checks').innerHTML = html;

    document.getElementById('last-update').textContent =
      '最后更新: ' + new Date().toLocaleTimeString('zh-CN');
  } catch(e) {
    document.getElementById('status-text').textContent = '无法连接';
    document.getElementById('checks').innerHTML =
      '<div class="check" style="border-color:#fecaca;background:#fef2f2">⚠️ 无法获取状态: ' + e.message + '</div>';
  }
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
