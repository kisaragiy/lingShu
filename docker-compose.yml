services:
  lingshu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lingshu
    ports:
      - "8788:8788"
    environment:
      - HARNESS_API_HOST=0.0.0.0
      - HARNESS_API_PORT=8788
      - HARNESS_DEEPSEEK_API=${HARNESS_DEEPSEEK_API:-}
      - HARNESS_CLOUD_KEY=${HARNESS_CLOUD_KEY:-}
      - HARNESS_LLAMA_API=${HARNESS_LLAMA_API:-}
      - HARNESS_MAX_CONCURRENT_AGENTS=${HARNESS_MAX_CONCURRENT_AGENTS:-5}
      - HARNESS_DISABLE_AUTH=${HARNESS_DISABLE_AUTH:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Optional: Self-hosted search engine
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "4000:8080"
    environment:
      # 这是**容器内**的变量：容器内 127.0.0.1 指容器自己，必须用容器自己的监听端口 8080
      # （端口映射是 "4000:8080"，宿主机访问才用 :4000）。写 4000 会让 SearXNG 生成
      # 指向宿主机映射端口的自引用 URL，容器内部访问不到自己。
      - SEARXNG_BASE_URL=http://localhost:8080
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-change-me-in-production}
      # 容器内无代理时 bing/google 一律返回空文档（"parsing error"），只剩国内引擎，
      # 而国内引擎高频抓取会立刻 CAPTCHA 封禁 → 表现为 HTTP 200 + results=0 的"假成功"。
      # 指向宿主代理（Docker Desktop 的 host.docker.internal）。
      # 注意：宿主代理若只监听 127.0.0.1（本机 smart-proxy 就是），
      # 容器经 host.docker.internal 访问会全部 timeout —— 此时引擎状态是
      # "timeout" 而不是 CAPTCHA。要么让代理监听网关地址，要么接受 SearXNG 出不了网。
      - HTTP_PROXY=${SEARXNG_HTTP_PROXY:-http://host.docker.internal:7899}
      - HTTPS_PROXY=${SEARXNG_HTTP_PROXY:-http://host.docker.internal:7899}
      # 国内引擎直连：走境外出口会被识别成异常 IP，百度/搜狗立刻 CAPTCHA
      - NO_PROXY=localhost,127.0.0.1,baidu.com,sogou.com,so.com,360.cn,quark.cn,sm.cn,cn.bing.com
    volumes:
      - searxng_data:/etc/searxng:rw
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      # 空 volume 首次启动时 entrypoint 要往 /etc/searxng 写 settings.yml；
      # 没有 DAC_OVERRIDE 时连 root 都写不进（实测 Restarting 127 + "Permission denied"）
      - DAC_OVERRIDE
    restart: unless-stopped

volumes:
  searxng_data:
