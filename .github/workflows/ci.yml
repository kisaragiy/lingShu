name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          # 增量类型门禁需要基准提交，浅克隆会漏掉跨多提交的改动。
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # dev 依赖在 [project.optional-dependencies]（extras），不是 PEP 735 的
        # [dependency-groups] —— `uv sync --group dev` 会报
        # "Group `dev` is not defined in the project's dependency-groups table" 并 exit 2，
        # 导致后面 10 个质量步骤全部 skipped（2026-08-23 → 09-07 连续 8 次红，无人发现）。
        run: uv sync --extra dev --frozen

      - name: "Ruff lint check (blocking) — 语法错 / 重定义 / 未定义名 / F 档"
        # F821 于 2026-09-10 归零（core/tools/web.py 的 `re` → `_re`，那条是活 bug：
        # NameError 被 except: pass 吞掉，工具 100% 静默退化成"不分解"）；随后 27 条 F 档
        # （21 F401 / 3 F541 / 3 F841）也批修清零 → 整档升为 blocking。
        # 升档前先按两档批修：普通 F401 可 `--fix`；探测型 import（rev_utils.py 的 `import frida`）
        # 必须先改 `importlib.util.find_spec`，否则 `--fix` 会静默削掉一条能力探测路径。
        run: uv run ruff check src/ --select F,E9

      - name: "Ruff format check (informational) — 68/91 文件未格式化"
        # informational by design：历史格式债会产生大面积 diff，需独立整理，避免污染功能审查。
        run: uv run ruff format --check src/
        continue-on-error: true

      - name: Mypy changed files (blocking, strict)
        # 保留 pyproject 的 strict 契约；历史未标注代码不阻塞无关文件，改动文件必须达标。
        # skip 只隔离被导入的历史模块，不忽略本次选中文件的类型错误。
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            diff_base=$(git merge-base "$base" HEAD)
            git diff --name-only -z --diff-filter=ACMR "$diff_base" HEAD -- 'src/**/*.py' > /tmp/mypy-files
          else
            # 首次推送或历史缺失时查全量，不能因无基准静默漏检。
            git ls-files -z -- 'src/**/*.py' > /tmp/mypy-files
          fi
          mapfile -d '' -t files < /tmp/mypy-files
          if [ "${#files[@]}" -eq 0 ]; then
            echo "没有改动的 src Python 文件，无需类型检查"
          else
            # 只拦「新增」strict 错误：core/ 里 59 个文件本来就有 662 个 strict 错误
            # （2026-10-23 实测）。裸 --strict 全量必然红；「只查改动文件」同样必然红
            # ——改到任何脏文件就红，等于禁止碰核心代码。baseline 在
            # mypy_baseline.json（文件→错误数），只许往下调；退出码 2 = 有新增。
            uv run python scripts/mypy_baseline.py --check "${files[@]}"
          fi

      - name: Bandit SAST
        run: uv run bandit -r src/ -c pyproject.toml -f json -o bandit_report.json 2>&1 || echo "⚠️ SAST scan completed"

      - name: Run tests with coverage
        # 覆盖率门槛：**ratchet**，不是愿望。实测 36.6%（7599 语句 / 4815 未覆盖），
        # 取 35 留 1.6pt 平台差余量（CI 是 Linux，本地是 Windows）。只许升不许降；
        # 从 70% 降到 35% 不是降低标准——原先是"空头门槛"，必然被跳过或无视。
        # 真正该拉的是 HTTP 边界路径覆盖（本轮之前为 0），总覆盖率是它的副产品。
        run: uv run pytest tests/ -q --cov=src/agent_harness --cov-report=term --cov-fail-under=35

      - name: Core pipeline and graph coverage gate (blocking)
        # 2026-10-23 Windows 实测：pipeline 69.96%、graph 79.79%，合计 TOTAL 74.10%。
        # 核心可靠性路径单独守门，避免全局覆盖率掩盖退化；保留上方全局 35% 门禁。
        # 按 floor(min(实测 TOTAL - 2, 70)) 取 70：留 2pt 平台差余量，沿用同仓全局门禁先例。
        # 这是可执行的 ratchet：门槛只许升不许降，不能用降低门槛掩盖覆盖率回退。
        run: uv run pytest tests/ -q --cov=src/agent_harness/core/pipeline --cov=src/agent_harness/core/graph --cov-report=term --cov-fail-under=70

      - name: Mutation testing (core modules)
        # informational by design：变异存活率尚无稳定基线，先观察再制定可执行阈值。
        run: |
          uv run mutmut run --paths src/agent_harness/core/tools/web.py src/agent_harness/core/safety/ --runner "python -m pytest -x -q" 2>&1 | tail -20 || echo "⚠️ Mutation test completed, review results"
        continue-on-error: true

      - name: Security audit (pip-audit, informational) — lock 内 55 条已知漏洞待升级
        # 为什么不是 blocking（2026-10-23 实测，别想当然）：
        #   ① 直接扫环境必红：项目自身是 editable 安装，`pip-audit --strict` 报
        #      "agent-harness: Dependency not found on PyPI and could not be audited" → exit 1；
        #      `--skip-editable` 在 --strict 下同样 exit 1。
        #   ② 改扫 `uv export --no-dev` 的依赖清单可跑通，但当前 lock 里有
        #      **55 条已知漏洞 / 10 个包**（aiohttp、urllib3、pypdf、chromadb、anyio、certifi…）。
        #      此时设成 blocking = CI 永久红，下一个人只会把这一步删掉或加 continue-on-error
        #      —— 那是比 informational 更差的结局（门禁被关掉，还留个"我们做过审计"的假象）。
        # 打开 blocking 的路径（做完就把 || echo 删掉，并把步骤名改回 blocking）：
        #   1) uv lock --upgrade-package aiohttp --upgrade-package urllib3 --upgrade-package pypdf …
        #   2) uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/req.txt
        #   3) uv run pip-audit -r /tmp/req.txt --strict  → 归零即改 blocking
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt --strict --progress-spinner=off 2>&1 || echo "⚠️ 有已知漏洞依赖（55 条历史债，升级路径见本步骤注释）"

      - name: Version consistency check
        run: |
          PKG_VER=$(grep -m1 '__version__' src/agent_harness/__init__.py 2>/dev/null | sed 's/.*"//;s/".*//')
          echo "Version: $PKG_VER"

      # informational by design：扫描远端标签而非本提交镜像，无法可靠归因本次改动。
      - name: Docker security scan (Trivy)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/library/agent-harness:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
        continue-on-error: true

      - name: Secret leak scan (truffleHog)
        run: |
          uv run trufflehog filesystem --no-verification . 2>&1 || echo "⚠️ 发现潜在密钥泄漏，请手动检查"

  integration:
    name: "Integration (live server)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 无密钥 CI 验证真实 HTTP/SSE 和模板降级，不依赖付费或本机 LLM。
      HARNESS_DISABLE_AUTH: "1"
      HARNESS_DISABLE_RATE_LIMIT: "1"
      HARNESS_API_HOST: "127.0.0.1"
      HARNESS_API_PORT: "8788"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Start server and run integration tests
        shell: bash
        run: |
          uv run python -m agent_harness.main > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            if curl --fail --silent --max-time 3 http://127.0.0.1:8788/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat server.log
            exit 1
          fi
          # 覆盖默认 not integration，防止目标用例再次被排除。
          uv run pytest -m integration -o addopts="-q --tb=short"
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-server-log
          path: server.log

  onboarding:
    name: "Fresh-clone onboarding (test the docs)"
    # ADR#12：README 就是对外 API 契约 —— 干净 clone + 只按文档步骤，必须能起服务、能跑测试。
    # 与 lint/覆盖率同族的 ratchet：文档漂移直接在 CI 变红，而不是等第一个用户来撞。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /tmp/lingshu-fresh
    steps:
      - uses: actions/checkout@v4

      - name: "Clone 到干净目录（等价于别人 clone：只有仓库跟踪的东西）"
        working-directory: ${{ github.workspace }}
        run: git clone --quiet . /tmp/lingshu-fresh

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: "按 README 快速开始：cp .env.example .env + 装依赖"
        run: |
          cp .env.example .env
          uv sync --extra dev --frozen

      - name: "断言服务起得来（/health == 200）"
        # 用 README:151 与 Dockerfile:37 的真实命令 `agent-harness serve`
        # （pyproject entry point → agent_harness.apps.research.run:main）。
        # 原先这里用 `python -m agent_harness.main` —— 那是**另一条入口**
        # （agent-api 用的），测它等于测一条用户不会走的路，README/Dockerfile
        # 坏了也照样绿。2026-10-23 本地实测 `agent-harness serve` 起得来、
        # /health 第 3 次探测 200（状态 degraded 但 HTTP 200）。
        run: |
          uv run agent-harness serve > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8788/health || true)
            if [ "$code" = "200" ]; then echo "✅ /health 200（第 $i 次探测）"; exit 0; fi
            sleep 2
          done
          echo "❌ 按 README 起不来，服务日志尾部："
          tail -40 server.log
          exit 1

      - name: "断言测试跑得起来（README 的默认口径）"
        run: uv run pytest