name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -x -q tests/ -v --tb=short

      - name: Version consistency check
        run: |
          PKG_VER=$(grep -m1 '__version__' src/agent_harness/__init__.py | sed 's/.*"//;s/".*//')
          echo "Version: $PKG_VER"
