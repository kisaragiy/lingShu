name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      mutation:
        description: Run optional mutation analysis (Linux only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync --extra dev --frozen
      - name: Syntax and undefined names (blocking)
        run: uv run ruff check src/ --select F,E9
      - name: Incremental strict types (blocking)
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          base="${PR_BASE_SHA:-$PUSH_BASE_SHA}"
          if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            git diff --name-only -z --diff-filter=ACMR "$(git merge-base "$base" HEAD)" HEAD -- 'src/**/*.py' > /tmp/mypy-files
          else
            git ls-files -z -- 'src/**/*.py' > /tmp/mypy-files
          fi
          mapfile -d '' -t files < /tmp/mypy-files
          uv run python scripts/mypy_baseline.py --check "${files[@]}"
      - name: High confidence high severity SAST (blocking)
        run: uv run bandit -r src/ -c pyproject.toml -lll -iii -f json -o bandit_report.json
      - name: Offline regression and global coverage (blocking)
        run: uv run pytest tests/ -q --cov=src/agent_harness --cov-report=term --cov-report=xml --cov-fail-under=35
      - name: Core pipeline and graph coverage (blocking)
        run: uv run coverage report --include='*/core/pipeline/*,*/core/graph/*' --fail-under=70
      - name: Locked runtime dependency audit (blocking)
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --format requirements-txt > audit-requirements.txt
          uv run pip-audit -r audit-requirements.txt --no-deps --disable-pip --strict --progress-spinner=off --format=json --output pip-audit.json
      - name: Version consistency (blocking)
        run: uv run python scripts/check_release_version.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: |
            bandit_report.json
            coverage.xml
            pip-audit.json

  source-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning (no credential verification)
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          version: v3.99.7
          extra_args: --no-verification --fail
      - name: Build the actual revision
        run: docker build -t lingshu:ci .
      - name: Scan the built image (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lingshu:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  mutation:
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
      - run: uv sync --extra dev --frozen
      - name: Run mutation analysis (optional, no score gate yet)
        run: uv run mutmut run
      - name: Show mutation results
        if: always()
        run: uv run mutmut results

  integration:
    name: "Integration (live server)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 无密钥 CI 验证真实 HTTP/SSE 和模板降级，不依赖付费或本机 LLM。
      HARNESS_DISABLE_AUTH: "1"
      HARNESS_DISABLE_RATE_LIMIT: "1"
      HARNESS_API_HOST: "127.0.0.1"
      HARNESS_API_PORT: "8788"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev --frozen
      - name: Start server and run integration tests
        shell: bash
        # 服务端与测试共用同一个数据根，指向 runner 临时目录。不加时默认落
        # ~/.agent-harness，测试写出的 session log/报告会被 ADR#5 守卫在 teardown
        # 判成「测试改动了真实用户数据」（2026-10-23 CI 实测：新增 sessions/cs_*.log）。
        # 注意：`runner` context 只能在 step 级 env 用，放到 job 级 env 会让整个
        # workflow 校验失败（"run likely failed because of a workflow file issue"）。
        env:
          HARNESS_DATA_DIR: ${{ runner.temp }}/lingshu-data
          # session 日志读的是 HARNESS_SESSION_DIR（session_store.py 的模块常量），
          # 与 audit 的 HARNESS_DATA_DIR 是两套变量 —— 只设后者时 session 仍写
          # ~/.agent-harness/sessions，ADR#5 守卫照旧报「测试改动了真实用户数据」。
          HARNESS_SESSION_DIR: ${{ runner.temp }}/lingshu-data/sessions
        run: |
          uv run python -m agent_harness.main > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            if curl --fail --silent --max-time 3 http://127.0.0.1:8788/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat server.log
            exit 1
          fi
          # 覆盖默认 not integration，防止目标用例再次被排除。
          uv run pytest -m integration -o addopts="-q --tb=short"
      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-server-log
          path: server.log

  onboarding:
    name: "Fresh-clone onboarding (test the docs)"
    # ADR#12：README 就是对外 API 契约 —— 干净 clone + 只按文档步骤，必须能起服务、能跑测试。
    # 与 lint/覆盖率同族的 ratchet：文档漂移直接在 CI 变红，而不是等第一个用户来撞。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /tmp/lingshu-fresh
    steps:
      - uses: actions/checkout@v4

      - name: "Clone 到干净目录（等价于别人 clone：只有仓库跟踪的东西）"
        working-directory: ${{ github.workspace }}
        run: git clone --quiet . /tmp/lingshu-fresh

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          # ci 上 post-job 的 cache prune 会卡满 5 分钟被杀（exit code 2）；
          # 这个 job 在临时目录跑一次，不需要 uv 缓存。
          enable-cache: false

      - name: "按 README 快速开始：cp .env.example .env + 装依赖"
        run: |
          cp .env.example .env
          uv sync --extra dev --frozen

      - name: "断言服务起得来（/health == 200）"
        # 用 README:151 与 Dockerfile:37 的真实命令 `agent-harness serve`
        # （pyproject entry point → agent_harness.apps.research.run:main）。
        # 原先这里用 `python -m agent_harness.main` —— 那是**另一条入口**
        # （agent-api 用的），测它等于测一条用户不会走的路，README/Dockerfile
        # 坏了也照样绿。2026-10-23 本地实测 `agent-harness serve` 起得来、
        # /health 第 3 次探测 200（状态 degraded 但 HTTP 200）。
        run: |
          uv run agent-harness serve > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8788/health || true)
            if [ "$code" = "200" ]; then echo "✅ /health 200（第 $i 次探测）"; exit 0; fi
            sleep 2
          done
          echo "❌ 按 README 起不来，服务日志尾部："
          tail -40 server.log
          exit 1

      - name: "断言测试跑得起来（README 的默认口径）"
        run: uv run pytest