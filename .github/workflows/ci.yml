name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # dev 依赖在 [project.optional-dependencies]（extras），不是 PEP 735 的
        # [dependency-groups] —— `uv sync --group dev` 会报
        # "Group `dev` is not defined in the project's dependency-groups table" 并 exit 2，
        # 导致后面 10 个质量步骤全部 skipped（2026-08-23 → 09-07 连续 8 次红，无人发现）。
        run: uv sync --extra dev --frozen

      - name: "Ruff lint check (blocking) — 语法错 / 重定义 / 未定义名 / F 档"
        # F821 于 2026-09-10 归零（core/tools/web.py 的 `re` → `_re`，那条是活 bug：
        # NameError 被 except: pass 吞掉，工具 100% 静默退化成"不分解"）；随后 27 条 F 档
        # （21 F401 / 3 F541 / 3 F841）也批修清零 → 整档升为 blocking。
        # 升档前先按两档批修：普通 F401 可 `--fix`；探测型 import（rev_utils.py 的 `import frida`）
        # 必须先改 `importlib.util.find_spec`，否则 `--fix` 会静默削掉一条能力探测路径。
        run: uv run ruff check src/ --select F,E9

      - name: "Ruff format check (informational) — 68/91 文件未格式化"
        # ruff 从未在 CI 跑过（上面那个 group 错误），所以全仓从未按 ruff format 落过格式。
        # 仓库级格式化会产生 68 文件的巨型 diff，必须独立提交，不要混进功能 PR。
        run: uv run ruff format --check src/
        continue-on-error: true

      - name: Mypy type check
        run: uv run mypy src/ --strict --ignore-missing-imports --allow-untyped-decorators
        continue-on-error: true

      - name: Bandit SAST
        run: uv run bandit -r src/ -c pyproject.toml -f json -o bandit_report.json 2>&1 || echo "⚠️ SAST scan completed"

      - name: Run tests with coverage
        # 覆盖率门槛：**ratchet**，不是愿望。实测 36.6%（7599 语句 / 4815 未覆盖），
        # 取 35 留 1.6pt 平台差余量（CI 是 Linux，本地是 Windows）。只许升不许降；
        # 从 70% 降到 35% 不是降低标准——原先是"空头门槛"，必然被跳过或无视。
        # 真正该拉的是 HTTP 边界路径覆盖（本轮之前为 0），总覆盖率是它的副产品。
        run: uv run pytest tests/ -q --cov=src/agent_harness --cov-report=term --cov-fail-under=35

      - name: Mutation testing (core modules)
        run: |
          uv run mutmut run --paths src/agent_harness/core/tools/web.py src/agent_harness/core/safety/ --runner "python -m pytest -x -q" 2>&1 | tail -20 || echo "⚠️ Mutation test completed, review results"
        continue-on-error: true

      - name: Security audit (pip-audit)
        run: |
          uv run pip-audit --strict --progress-spinner=off 2>&1 || echo "⚠️ 有已知漏洞依赖，建议修复"

      - name: Version consistency check
        run: |
          PKG_VER=$(grep -m1 '__version__' src/agent_harness/__init__.py 2>/dev/null | sed 's/.*"//;s/".*//')
          echo "Version: $PKG_VER"

      - name: Docker security scan (Trivy)
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/library/agent-harness:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
        continue-on-error: true

      - name: Secret leak scan (truffleHog)
        run: |
          uv run trufflehog filesystem --no-verification . 2>&1 || echo "⚠️ 发现潜在密钥泄漏，请手动检查"

  onboarding:
    name: "Fresh-clone onboarding (test the docs)"
    # ADR#12：README 就是对外 API 契约 —— 干净 clone + 只按文档步骤，必须能起服务、能跑测试。
    # 与 lint/覆盖率同族的 ratchet：文档漂移直接在 CI 变红，而不是等第一个用户来撞。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /tmp/lingshu-fresh
    steps:
      - uses: actions/checkout@v4

      - name: "Clone 到干净目录（等价于别人 clone：只有仓库跟踪的东西）"
        working-directory: ${{ github.workspace }}
        run: git clone --quiet . /tmp/lingshu-fresh

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: "按 README 快速开始：cp .env.example .env + 装依赖"
        run: |
          cp .env.example .env
          uv sync --extra dev --frozen

      - name: "断言服务起得来（/health == 200）"
        run: |
          uv run python -m agent_harness.main > server.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:8788/health || true)
            if [ "$code" = "200" ]; then echo "✅ /health 200（第 $i 次探测）"; exit 0; fi
            sleep 2
          done
          echo "❌ 按 README 起不来，服务日志尾部："
          tail -40 server.log
          exit 1

      - name: "断言测试跑得起来（README 的默认口径）"
        run: uv run pytest