[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -q --tb=short --no-header -m "not integration"
timeout = 30
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    integration: tests that need a running server
    slow: tests that take >5 seconds
