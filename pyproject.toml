[project]
name = "agent-harness"
version = "0.75.1"
description = "LangGraph-based multi-agent orchestration framework with MCP tool ecosystem"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "kisaragiy", email = "taqibala@outlook.com"},
]
keywords = ["langgraph", "agent", "mcp", "llm", "ai", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "chromadb>=0.5.0",
    "numpy>=1.24.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "rich>=13.0",
    "prometheus-client>=0.19",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
desktop = [
    "pyautogui>=0.9.54",
    "playwright>=1.45.0",
    "Pillow>=10.0",
    "opencv-python>=4.9.0",
    "mss>=9.0.0",
    "dxcam>=0.0.4",
]
comfyui = [
    "Pillow>=10.0",
    "requests>=2.32.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "mutmut>=3.0",
]
all = [
    "agent-harness[desktop,comfyui,dev]",
]

[project.scripts]
agent-harness = "agent_harness.apps.research.run:main"
agent-mcp = "agent_harness.core.mcp_server:main"
agent-api = "agent_harness.main:main"
agent-comic = "agent_harness.apps.research.run:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ─── Ruff ───
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "N", "W"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy (strict mode) ───
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
allow_untyped_decorators = true
exclude = [
    "build/",
    "dist/",
    "tests/",
    ".venv/",
]

# ─── Pytest ───
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

# ─── Bandit (SAST) ───
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101", "B311", "B404", "B603", "B607"]

# ─── Mutmut (mutation testing) ───
[tool.mutmut]
paths = ["src/agent_harness"]
backup = false
runner = "python -m pytest -x -q"