[project]
name = "agent-harness"
version = "0.75.3"
description = "Self-hostable multi-agent research assistant that traces every conclusion to primary sources"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "kisaragiy", email = "taqibala@outlook.com"},
]
keywords = ["langgraph", "agent", "mcp", "llm", "ai", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "langgraph>=0.2.0",
    # P0-3：崩溃续跑必须用持久化 checkpointer；内存 saver 只能防同进程内中断
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-core>=0.4.0",
    "fastapi>=0.115.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "numpy>=1.24.0",
    "pypdf>=3.0.0",
    "python-docx>=0.8.11",
    "rich>=13.0",
    "prometheus-client>=0.19",
    "structlog>=24.1.0",
    # SEC-18：config.json 的 llm.api_key 用本机派生 KEK（Fernet）加密落盘
    "cryptography>=42.0",
]

[project.optional-dependencies]
desktop = [
    "pyautogui>=0.9.54",
    "playwright>=1.45.0",
    "Pillow>=10.0",
    "opencv-python>=4.9.0",
    "mss>=9.0.0",
    "dxcam>=0.0.4",
]
comfyui = [
    "Pillow>=10.0",
    "requests>=2.32.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # pytest.ini 里已有 `timeout = 30`，但没有这个插件时它是**死配置**
    # （pytest 只发 PytestConfigWarning，而它继承 UserWarning，又被 filterwarnings 忽略）。
    # 本仓已证实存在挂死型缺陷（HEAD 版 report_store.save_report 锁自死锁，永久挂住线程），
    # 没有 per-test 超时的话 CI 会一直挂到 GitHub 的 6 小时上限。最慢用例实测 9.4s。
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.6.0",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "mutmut>=3.0",
]
all = [
    "agent-harness[desktop,comfyui,dev]",
]

[project.scripts]
agent-harness = "agent_harness.apps.research.run:main"
agent-mcp = "agent_harness.core.mcp_server:main"
agent-api = "agent_harness.main:main"
agent-comic = "agent_harness.apps.research.run:main"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# 静态资源必须进 wheel —— 否则 pip 安装后前端与管理后台全部 404。
# ENG-5/6 实况：Dockerfile 曾用 COPY 手工补 agent_harness/static（管理后台），
# 但**漏了 apps/research/static（主前端整个目录）**；且离开 Docker 用 pip 安装时
# 两个目录都不会进包。主前端的真实挂载点在 main.py: RESEARCH_STATIC_DIR。
[tool.setuptools.package-data]
"agent_harness" = ["static/**/*", "static/*"]
"agent_harness.apps.research" = ["static/**/*", "static/*"]

# ─── Ruff ───
[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "N", "W"]
ignore = ["E501", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy (strict mode) ───
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
allow_untyped_decorators = true
exclude = [
    "build/",
    "dist/",
    "tests/",
    ".venv/",
]

# ─── Pytest ───
# 配置以仓库根 `pytest.ini` 为**唯一权威**（pytest.ini 优先于 pyproject）。
# 此块曾有第二份声明（testpaths/addopts/filterwarnings）却从不生效，
# 2026-09-10 删除：同一语义多份来源、"谁生效"靠加载顺序 —— ADR#5 单一权威来源。

# ─── Bandit (SAST) ───
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
skips = ["B101", "B311", "B404", "B603", "B607"]

# ─── Mutmut (mutation testing) ───
[tool.mutmut]
paths = ["src/agent_harness"]
backup = false
runner = "python -m pytest -x -q"